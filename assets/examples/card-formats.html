<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Paperlogy;font-weight:500;src:url(../fonts/Paperlogy-5Medium.ttf)}
@font-face{font-family:Paperlogy;font-weight:700;src:url(../fonts/Paperlogy-7Bold.ttf)}
@font-face{font-family:SUIT;font-weight:500;src:url(../fonts/SUIT-Medium.woff2)}
@font-face{font-family:SUIT;font-weight:600;src:url(../fonts/SUIT-SemiBold.woff2)}
@font-face{font-family:SUIT;font-weight:700;src:url(../fonts/SUIT-Bold.woff2)}
*{box-sizing:border-box}body{margin:0;background:#F4EFEB;color:#1A1A1A}
.art{width:1200px;padding:68px 72px 83px;position:relative;background:#F4EFEB}
.hd{display:flex;justify-content:space-between;align-items:flex-start}
.lg{width:150px;flex:none;margin-top:13.6px}
h1{margin:0;font:700 80px/1.2 Paperlogy;letter-spacing:-.02em}
.sub{margin-top:2px;font:500 40px/1.3 SUIT;color:#5E4E49;letter-spacing:-.01em}
.card{background:#fff;border-radius:28px;box-shadow:3px 4px 10px rgba(74,51,44,.40)}
.card.on{background:#EB5A10;box-shadow:4px 6px 14px rgba(74,51,44,.50)}
b{font-weight:500} s{text-decoration:none} i{font-style:normal}
.on b,.on i,.on q{color:#fff!important} .on s{color:#FFE7DA!important}
.cap{font:500 40px SUIT;color:#988680}
/* steps */
.st{display:flex;align-items:center;justify-content:space-between;margin-top:88px}
.st .card{position:relative;width:206px;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-top:18px}
.st .card.on{width:262px;height:248px}
.n{position:absolute;top:-37px;left:50%;transform:translateX(-50%);width:74px;height:74px;border-radius:999px;background:#4A332C;color:#fff;font:700 40px SUIT;display:flex;align-items:center;justify-content:center}
.st b{font:500 54px Paperlogy;white-space:nowrap}.st .on b{font-size:66px}
/* list */
.ls{display:flex;flex-direction:column;gap:24px;margin-top:52px}
.ls .card{display:flex;align-items:center;gap:32px;padding:0 40px;height:112px;width:940px}
.ls .card.on{width:1056px;height:128px}
.ls b{font:500 58px Paperlogy;width:330px;flex:none}.ls .on b{font-size:64px}
/* vs */
.vs{display:flex;align-items:stretch;margin-top:52px}
.p{flex:1;padding:40px 44px;display:flex;flex-direction:column;gap:22px}
.p.on{flex:1.3}
.t{align-self:flex-start;font:700 40px SUIT;padding:6px 26px;border-radius:999px;background:#4A332C;color:#fff}
.on .t{background:#fff;color:#D34600}
.p q{font:500 50px/1.4 SUIT;quotes:none;letter-spacing:-.01em}
.mid{width:100px;display:flex;align-items:center;justify-content:center;font:700 50px Paperlogy;color:#4A332C}
</style></head><body><div class="art" id="ex-steps"><div class="hd"><h1>클로드 모델 고르는 순서</h1><img class="lg" src="../logo/wordmark-gray-warm.svg"></div><div class="sub">일이 어려울수록 오른쪽으로</div><div class="st"><div class="card"><div class="n">1</div><b>하이쿠</b><s class="cap">반복</s></div><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#4A332C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg><div class="card"><div class="n">2</div><b>소넷</b><s class="cap">일상</s></div><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#4A332C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg><div class="card on"><div class="n">3</div><b>오퍼스</b><s class="cap">판단</s></div><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#4A332C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg><div class="card"><div class="n">4</div><b>페이블</b><s class="cap">난제</s></div></div></div><div class="art" id="ex-list"><div class="hd"><h1>어떤 일에 어떤 모델?</h1><img class="lg" src="../logo/wordmark-gray-warm.svg"></div><div class="sub">Opus, Sonnet, Haiku 고르는 기준</div><div class="ls"><div class="card on"><b>오퍼스 5.5</b><s class="cap">판단이 필요한 일</s></div><div class="card"><b>소넷 5.5</b><s class="cap">할 일이 분명한 일</s></div><div class="card"><b>하이쿠 5.5</b><s class="cap">짧고 반복되는 일</s></div></div></div><div class="art" id="ex-vs"><div class="hd"><h1>오퍼스 소넷 차이</h1><img class="lg" src="../logo/wordmark-gray-warm.svg"></div><div class="sub">Opus, Sonnet 한 줄 정리</div><div class="vs"><div class="card p"><span class="t">소넷 5.5</span><q>할 일이 분명하면<br>가격은 절반</q></div><div class="mid">vs</div><div class="card on p"><span class="t">오퍼스 5.5</span><q>판단을 이어가야<br>하는 일이면</q></div></div></div></body></html>
