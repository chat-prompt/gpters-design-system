<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Paperlogy;font-weight:700;src:url(../fonts/Paperlogy-7Bold.ttf)}
@font-face{font-family:Paperlogy;font-weight:500;src:url(../fonts/Paperlogy-5Medium.ttf)}
@font-face{font-family:SUIT;font-weight:500;src:url(../fonts/SUIT-Medium.woff2)}
@font-face{font-family:SUIT;font-weight:700;src:url(../fonts/SUIT-Bold.woff2)}
*{box-sizing:border-box}body{margin:0;background:#F4EFEB;color:#1A1A1A}
.art{width:1200px;padding:68px 72px 83px;position:relative}
h1{margin:0;font:700 80px/1.2 Paperlogy;letter-spacing:-.02em}
.sub{margin-top:2px;font:500 40px/1.3 SUIT;color:#5E4E49;letter-spacing:-.01em}
.g{display:grid;grid-template-columns:1fr 1fr;gap:32px 36px;margin-top:52px}
.card{background:#fff;border:none;box-shadow:var(--s);border-radius:28px;height:184px;padding:0 44px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.card.on{background:#EB5A10;box-shadow:var(--so)}
.top{display:flex;justify-content:center;align-items:baseline;gap:16px}
b{font:500 62px/1.15 Paperlogy;color:#1A1A1A} i{font:500 50px SUIT;font-style:normal;color:#988680}
s{text-decoration:none;font:500 40px SUIT;color:#988680}
.on b,.on i{color:#fff}.on s{color:#FFD9C6}
.hd{display:flex;justify-content:space-between;align-items:flex-start}.lg{width:150px;flex:none;margin-top:13.6px}</style></head><body><div class="art" id="a" style="--s:3px 4px 10px rgba(74,51,44,.40);--so:4px 6px 14px rgba(74,51,44,.50)">
<div class="hd"><h1>클로드 모델별 차이</h1><img class="lg" src="../logo/wordmark-gray-warm.svg"></div><div class="sub">Fable, Opus, Sonnet, Haiku 비교</div><div class="g"><div class="card"><div class="top"><b>페이블</b><i>5.1</i></div><s>가장 똑똑함</s></div><div class="card on"><div class="top"><b>오퍼스</b><i>5.5</i></div><s>공식 추천</s></div><div class="card"><div class="top"><b>소넷</b><i>5.5</i></div><s>빠르고 균형</s></div><div class="card"><div class="top"><b>하이쿠</b><i>5.5</i></div><s>싸고 빠름</s></div></div></div></body></html>
